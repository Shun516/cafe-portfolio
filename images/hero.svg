<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 仮のヒーロー画像（写真風イラスト）：コンクリートの壁・黒い石のカウンター・間接照明・エスプレッソ。
       実際の写真に差し替える前提のダミーです -->
  <defs>
    <!-- コンクリートの質感 -->
    <filter id="concrete" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
    <filter id="blurL" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="blurM" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blurS" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>

    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a29"/>
      <stop offset="0.55" stop-color="#3a3937"/>
      <stop offset="1" stop-color="#232322"/>
    </linearGradient>
    <!-- 間接照明が壁を照らす光 -->
    <radialGradient id="wash" cx="0.62" cy="0.02" r="0.75">
      <stop offset="0" stop-color="#d8d2c6" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#a49d92" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="counterTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e2e2e"/>
      <stop offset="0.6" stop-color="#4a4a48"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3d3f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#151617" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="crema" cx="0.45" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#b98a5c"/>
      <stop offset="0.6" stop-color="#7a5232"/>
      <stop offset="1" stop-color="#3b2516"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="0.35" stop-color="#3a3a3a"/>
      <stop offset="0.55" stop-color="#202020"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.6" cy="0.45" r="0.85">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
  </defs>

  <!-- コンクリートの壁 -->
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect width="1600" height="1000" filter="url(#concrete)"/>
  <!-- 打ち放しの目地と型枠の穴 -->
  <g stroke="#1a1a1a" stroke-width="2" opacity="0.7">
    <path d="M0 250 H1600 M0 500 H1600 M400 0 V700 M800 0 V700 M1200 0 V700"/>
  </g>
  <g fill="#1d1d1d" opacity="0.8">
    <circle cx="100" cy="125" r="7"/><circle cx="300" cy="125" r="7"/><circle cx="500" cy="125" r="7"/><circle cx="700" cy="125" r="7"/>
    <circle cx="900" cy="125" r="7"/><circle cx="1100" cy="125" r="7"/><circle cx="1300" cy="125" r="7"/><circle cx="1500" cy="125" r="7"/>
    <circle cx="100" cy="375" r="7"/><circle cx="300" cy="375" r="7"/><circle cx="500" cy="375" r="7"/><circle cx="700" cy="375" r="7"/>
    <circle cx="900" cy="375" r="7"/><circle cx="1100" cy="375" r="7"/><circle cx="1300" cy="375" r="7"/><circle cx="1500" cy="375" r="7"/>
    <circle cx="100" cy="600" r="7"/><circle cx="300" cy="600" r="7"/><circle cx="500" cy="600" r="7"/><circle cx="700" cy="600" r="7"/>
    <circle cx="900" cy="600" r="7"/><circle cx="1100" cy="600" r="7"/><circle cx="1300" cy="600" r="7"/><circle cx="1500" cy="600" r="7"/>
  </g>

  <!-- 天井の間接照明（細いライン＋壁への光） -->
  <rect width="1600" height="1000" fill="url(#wash)"/>
  <rect x="560" y="0" width="1040" height="6" fill="#efe9dc" opacity="0.85"/>
  <rect x="560" y="0" width="1040" height="30" fill="#efe9dc" opacity="0.35" filter="url(#blurM)"/>

  <!-- 左側のスモークガラス（黒い金属フレーム） -->
  <rect x="0" y="0" width="380" height="720" fill="url(#glass)"/>
  <g filter="url(#blurL)" opacity="0.35">
    <rect x="60" y="80" width="120" height="520" fill="#6c6f72"/>
  </g>
  <path d="M190 0 V720 M0 360 H380" stroke="#0a0a0a" stroke-width="10"/>
  <rect x="375" y="0" width="14" height="720" fill="#0a0a0a"/>

  <!-- ペンダントライト（黒い金属） -->
  <path d="M1130 0 V250" stroke="#0d0d0d" stroke-width="3"/>
  <path d="M1080 250 H1180 L1170 290 H1090 Z" fill="#111"/>
  <ellipse cx="1130" cy="292" rx="40" ry="5" fill="#f3ede2" opacity="0.9"/>
  <ellipse cx="1130" cy="330" rx="140" ry="60" fill="#f3ede2" opacity="0.12" filter="url(#blurL)"/>

  <!-- 黒い石のカウンター -->
  <rect x="0" y="700" width="1600" height="300" fill="url(#counter)"/>
  <rect x="0" y="700" width="1600" height="16" fill="url(#counterTop)"/>
  <rect x="0" y="700" width="1600" height="2" fill="#8d8a84" opacity="0.6"/>
  <!-- 石の映り込み -->
  <rect x="950" y="716" width="380" height="120" fill="#f3ede2" opacity="0.05" filter="url(#blurL)"/>

  <!-- エスプレッソカップとソーサー -->
  <g filter="url(#blurS)">
    <ellipse cx="1130" cy="742" rx="150" ry="26" fill="#000" opacity="0.6"/>
    <ellipse cx="1130" cy="728" rx="140" ry="24" fill="#2b2b2b"/>
    <ellipse cx="1130" cy="724" rx="104" ry="15" fill="#1a1a1a"/>
    <path d="M1060 630 L1200 630 L1190 708 Q1130 732 1070 708 Z" fill="url(#cup)"/>
    <path d="M1198 650 q46 2 40 32 q-6 26 -46 22" fill="none" stroke="#232323" stroke-width="11"/>
    <ellipse cx="1130" cy="630" rx="70" ry="13" fill="url(#crema)"/>
    <ellipse cx="1112" cy="628" rx="22" ry="4" fill="#d9b38a" opacity="0.5"/>
    <!-- 縁のハイライト -->
    <path d="M1062 632 Q1130 650 1198 632" fill="none" stroke="#6a6a6a" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- 湯気 -->
  <g fill="none" stroke="#e9e3d6" stroke-width="5" stroke-linecap="round" opacity="0.18" filter="url(#blurM)">
    <path d="M1110 595 q22 -40 0 -80 q-22 -40 0 -80"/>
    <path d="M1158 590 q22 -36 0 -72 q-22 -36 0 -72"/>
  </g>

  <!-- 周辺減光 -->
  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
